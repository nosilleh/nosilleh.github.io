<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Página do desenvolvedor nosilleH." />
    <title>nosilleH | Aplicativos</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef5fb;
        --surface: #fff;
        --text: #10243d;
        --muted: #536a83;
        --line: #d7e3ef;
        --accent: #075fca;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 17px/1.6 "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 90% 0%, rgba(0, 210, 255, 0.22), transparent 32rem),
          linear-gradient(180deg, #e8f3ff, var(--bg));
      }

      main {
        width: min(100%, 680px);
        padding: 32px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 54px rgba(7, 59, 142, 0.14);
      }

      h1 { margin: 0 0 8px; color: var(--accent); }
      p { margin: 0 0 20px; color: var(--muted); }

      a {
        display: inline-block;
        padding: 12px 16px;
        color: #fff;
        background: var(--accent);
        border-radius: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #ffcb3d;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>nosilleH</h1>
      <p>
        Página do desenvolvedor de aplicativos para Android. Para dúvidas,
        suporte ou privacidade, entre em contato pelo e-mail
        <strong>hvsuportt@gmail.com</strong>.
      </p>
      <a href="https://nosilleh.github.io/cartao-sus-digital-privacy/">
        Política de Privacidade — Cartão SUS Digital
      </a>
    </main>
  </body>
</html>
